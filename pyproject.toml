[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shotsieve"
version = "0.4.10"
description = "Local-first photo quality scanner and cache"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
classifiers = [
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
]
dependencies = [
	"numpy>=2.5.3",
	"Pillow>=12.3.0",
]

[project.optional-dependencies]
test = [
	"pytest>=9.1.1",
	"playwright>=1.63.0",
	"ruff>=0.16.8",
]
lint = [
	"ruff>=0.16.8",
]
format-loaders = [
	"pillow-heif>=1.8.0",
	# PyPI labels the project Beta, but rawpy defines final, non-prerelease
	# version numbers as stable and 0.27.1 is the latest such release.
	"rawpy>=0.27.1",
]
learned-iqa = [
	"pyiqa==0.1.16",
	"setuptools>=81.0.0,<82",
	"facexlib>=0.3.0",
	"timm>=1.0.30",
	"huggingface-hub>=1.32.0",
	"transformers>=5.17.0",
	"openai-clip>=1.0.1",
	"accelerate>=1.15.0",
	"sentencepiece>=0.2.2",
	"einops>=0.8.2",
	"icecream>=2.2.0",
]
windows-build = [
	"pip>=26.2.1",
	"setuptools>=81.0.0,<82",
	"wheel>=0.48.0",
	"packaging>=26.3",
	"pyinstaller>=6.22.3",
]

[project.scripts]
shotsieve-desktop = "shotsieve.desktop:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shotsieve = ["static/*.html", "static/*.js", "static/*.css"]

[tool.ruff.lint]
# Keep the default correctness/error checks consistent across developer machines.
select = ["E4", "E7", "E9", "F"]
