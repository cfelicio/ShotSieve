name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  offline-tests:
    name: offline-tests-${{ matrix.os }}-py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel packaging
          python -m pip install -e .[test]

      - name: Check installed requirements
        run: python -m pip check

      - name: Install browser for frontend tests
        run: python -m playwright install --with-deps chromium

      - name: Run focused static checks
        run: python -m ruff check --select F,E9 src tests

      - name: Run offline test suite
        run: python -m pytest -q

  core-python-314:
    name: core-python-3.14
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install core test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel packaging
          python -m pip install -e .[test]

      - name: Check installed requirements
        run: python -m pip check

      - name: Run focused static checks
        run: python -m ruff check --select F,E9 src tests

      - name: Install browser for frontend tests
        run: python -m playwright install --with-deps chromium

      - name: Run Python 3.14 test suite
        run: python -m pytest -q

  wheel-smoke:
    name: wheel-smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install wheel builder
        run: python -m pip install --upgrade pip build

      - name: Build wheel
        run: python -m build --wheel --outdir dist

      - name: Install and smoke wheel outside checkout
        shell: bash
        run: |
          wheel_venv="$RUNNER_TEMP/shotsieve-wheel-venv"
          python -m venv "$wheel_venv"
          "$wheel_venv/bin/python" -m pip install --upgrade pip
          "$wheel_venv/bin/python" -m pip install dist/*.whl
          "$wheel_venv/bin/python" -m pip check
          "$wheel_venv/bin/python" -c "from importlib.resources import files; assert files('shotsieve').joinpath('static/index.html').is_file()"
          "$wheel_venv/bin/shotsieve-desktop" --help
