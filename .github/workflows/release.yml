name: ci-release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish (for example, v0.5.0)
        required: true
        type: string

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  RELEASE_CONSTRAINTS: scripts/release-constraints.txt

jobs:
  resolve-release-source:
    name: resolve-release-source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}

    steps:
      - name: Checkout requested release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - id: source
        name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"].strip()
          if not tag or tag != os.environ["RELEASE_TAG"] or "/" in tag or "\\" in tag:
              raise SystemExit(f"Release tag must be a plain tag name, got {tag!r}")
          tag_ref = f"refs/tags/{tag}"
          expected_version = tag[1:] if tag.startswith("v") else tag
          with Path("pyproject.toml").open("rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          if version != expected_version:
              raise SystemExit(f"Release tag {tag!r} does not match package version {version!r}")
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tag_commit = subprocess.check_output(
              ["git", "rev-parse", "--verify", f"{tag_ref}^{{commit}}"], text=True
          ).strip()
          if commit != tag_commit:
              raise SystemExit(f"Checked out commit {commit} does not match {tag_ref} at {tag_commit}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"commit={commit}\n")
          PY

  test:
    name: test-${{ matrix.os }}-py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: resolve-release-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release-source.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel packaging
          python -m pip install -e .[test]

      - name: Check installed requirements
        run: python -m pip check

      - name: Run focused static checks
        run: python -m ruff check --select F,E9 src tests

      - name: Install browser for frontend tests
        run: python -m playwright install --with-deps chromium

      - name: Run test suite
        run: python -m pytest -q

  prepare-release-matrix:
    name: prepare-release-matrix
    runs-on: ubuntu-latest
    needs: resolve-release-source

    outputs:
      runtime_matrix: ${{ steps.runtime-matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release-source.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - id: runtime-matrix
        name: Export runtime pack release matrix
        shell: bash
        run: |
          echo 'matrix<<EOF' >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys
          from pathlib import Path

          project_root = Path.cwd()
          sys.path.insert(0, str(project_root / "src"))
          from shotsieve.release_targets import tier1_release_matrix

          print(json.dumps({"include": tier1_release_matrix()}))
          PY
          echo 'EOF' >> "$GITHUB_OUTPUT"

  build-python-dist:
    name: build-python-dist
    runs-on: ubuntu-latest
    needs:
      - test
      - resolve-release-source

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release-source.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload Python distributions
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v6
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  build-tier1-portable-bundles:
    name: build-${{ matrix.id }}
    runs-on: ${{ matrix.runsOn }}
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - test
      - prepare-release-matrix
      - resolve-release-source
    env:
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-release-matrix.outputs.runtime_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release-source.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.pythonVersion }}

      - name: Free disk space on Linux runners
        if: runner.os == 'Linux'
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo docker image prune --all --force || true
          df -h

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel packaging -c ${{ env.RELEASE_CONSTRAINTS }} -c ${{ matrix.constraintsFile }}

      - name: Build local AMD ROCm selector wheel
        if: matrix.torchVariant == 'rocm'
        run: python -m pip wheel --no-deps --wheel-dir "build/release-targets/${{ matrix.id }}/rocm-selector-wheel" rocm==10.0.0 --index-url https://stable.repo.amd.com/rocm/whl-next/ --extra-index-url https://pypi.org/simple

      - name: Install stable AMD ROCm 10 Torch runtime
        if: matrix.torchVariant == 'rocm'
        run: python -m pip install --no-cache-dir rocm==10.0.0 "torch[device-gfx1103]==2.13.0+rocm10.0.0" "torchvision[device-gfx1103]==0.28.0+rocm10.0.0" --index-url https://stable.repo.amd.com/rocm/whl-next/ --extra-index-url https://pypi.org/simple --find-links "build/release-targets/${{ matrix.id }}/rocm-selector-wheel" --only-binary=rocm -c ${{ env.RELEASE_CONSTRAINTS }} -c ${{ matrix.constraintsFile }}

      - name: Install CPU Torch runtime
        if: matrix.torchVariant == 'cpu'
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu -c ${{ env.RELEASE_CONSTRAINTS }} -c ${{ matrix.constraintsFile }}

      - name: Install default Torch runtime
        if: matrix.torchVariant == 'default'
        run: |
          python -m pip install torch torchvision -c ${{ env.RELEASE_CONSTRAINTS }} -c ${{ matrix.constraintsFile }}

      - name: Install pinned CUDA Torch runtime
        if: matrix.torchVariant == 'cuda'
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cu130 --trusted-host download.pytorch.org -c ${{ env.RELEASE_CONSTRAINTS }} -c ${{ matrix.constraintsFile }}

      - name: Install pinned Intel XPU Torch runtime
        if: matrix.torchVariant == 'xpu'
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/xpu --extra-index-url https://pypi.org/simple -c ${{ env.RELEASE_CONSTRAINTS }} -c ${{ matrix.constraintsFile }}

      - name: Install ShotSieve build dependencies
        run: |
          python -m pip install -e ".[${{ join(matrix.extras, ',') }}]" -c ${{ env.RELEASE_CONSTRAINTS }} -c ${{ matrix.constraintsFile }}
          python -m pip install pyinstaller -c ${{ env.RELEASE_CONSTRAINTS }} -c ${{ matrix.constraintsFile }}

      - name: Check resolved release requirements
        run: python -m pip check

      - name: Build portable bundle
        env:
          # All portable archives are torchless.  Torch remains installed in
          # the build environment so PyInstaller can analyze learned-IQA
          # imports, but it is excluded from the published archive.
          SHOTSIEVE_SKIP_BUNDLED_TORCH: "1"
        run: |
          python scripts/build_portable_bundle.py --target ${{ matrix.id }}

      - name: Export portable bundle plan
        shell: pwsh
        run: |
          python scripts/build_portable_bundle.py --target ${{ matrix.id }} --plan | Set-Content -Path bundle-plan.json

      - name: Smoke test portable bundle
        shell: pwsh
        run: |
          $plan = Get-Content bundle-plan.json -Raw | ConvertFrom-Json
          if (-not (Test-Path $plan.archivePath)) {
            throw "Expected archive not found at $($plan.archivePath)"
          }

          $launcher = Join-Path $plan.distPath $plan.target.executableName
          if (-not (Test-Path $launcher)) {
            throw "Expected launcher not found at $launcher"
          }

          $bundledWeights = Get-ChildItem -LiteralPath $plan.distPath -Recurse -File |
            Where-Object { $_.Extension.ToLowerInvariant() -in @('.safetensors', '.ckpt', '.pth', '.pt') }
          if ($bundledWeights) {
            $paths = ($bundledWeights | ForEach-Object { $_.FullName }) -join ", "
            throw "Model weight files must not be bundled in a portable release: $paths"
          }

          $bundledTorch = Get-ChildItem -LiteralPath $plan.distPath -Recurse -File |
            Where-Object { $_.FullName -match '(?i)(\\|/)(torch|torchvision|torchaudio|functorch|triton)(\\|/)' -or $_.Name -match '(?i)^(torch|torchvision|torchaudio|functorch|triton)' }
          if ($bundledTorch) {
            $paths = ($bundledTorch | ForEach-Object { $_.FullName }) -join ", "
            throw "PyTorch packages and native libraries must not be bundled in a portable release: $paths"
          }

          & $launcher --help | Out-Null

      - name: Upload portable bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.id }}-portable-bundle
          path: dist/${{ matrix.archiveName }}
          if-no-files-found: error
          retention-days: 3

  publish-release:
    name: publish-release
    runs-on: ubuntu-latest
    needs:
      - build-python-dist
      - build-tier1-portable-bundles
      - resolve-release-source
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release-source.outputs.commit }}

      - name: Verify publication checkout matches tested source
        env:
          EXPECTED_RELEASE_COMMIT: ${{ needs.resolve-release-source.outputs.commit }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_RELEASE_COMMIT']; assert actual == expected, f'{actual} != {expected}'"

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Set up Python for release asset preparation
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Prepare release assets within GitHub size limits
        run: |
          python scripts/prepare_release_assets.py \
            --source-root release-assets \
            --output-root release-publish

      - name: Generate checksummed bootstrap manifest
        run: |
          python scripts/generate_bootstrap_manifest.py \
            --archive-root release-publish \
            --output release-publish/bootstrap-manifest.json \
            --release-tag "${RELEASE_TAG}" \
            --repository "${GITHUB_REPOSITORY}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            release-publish/bootstrap-manifest.json
            release-publish/**/*.whl
            release-publish/**/*.zip
            release-publish/**/*.tar.gz
            release-publish/**/*.part-*
          generate_release_notes: true

      - name: Delete workflow artifacts after publishing release
        if: ${{ success() }}
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner,
                repo,
                run_id,
                per_page: 100,
              }
            );

            for (const artifact of artifacts) {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              });
              core.info(`Deleted artifact: ${artifact.name}`);
            }
