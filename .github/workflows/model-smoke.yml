name: model-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  learned-models:
    name: learned-${{ matrix.model }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
          model:
            - topiq_nr
            - clipiqa
            - qrealign-mini

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install learned-IQA runtime
        run: |
          python -m pip install --upgrade pip setuptools wheel packaging -c scripts/release-constraints.txt -c scripts/release-constraints-torch.txt
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu --trusted-host download.pytorch.org -c scripts/release-constraints.txt -c scripts/release-constraints-torch.txt
          python -m pip install -e ".[learned-iqa]" -c scripts/release-constraints.txt -c scripts/release-constraints-torch.txt
          python -m pip check

      - name: Prepare model into a fresh isolated cache
        env:
          SMOKE_MODEL: ${{ matrix.model }}
        shell: bash
        run: |
          python scripts/model_smoke.py \
            --model "$SMOKE_MODEL" \
            --cache-dir "$RUNNER_TEMP/shotsieve-cache/$SMOKE_MODEL" \
            --data-dir "$RUNNER_TEMP/shotsieve-data/$SMOKE_MODEL" \
            --report-path "$RUNNER_TEMP/shotsieve-model-smoke/$SMOKE_MODEL-online.json"

      - name: Re-open and score one generated image with network disabled
        env:
          SMOKE_MODEL: ${{ matrix.model }}
        shell: bash
        run: |
          python scripts/model_smoke.py \
            --model "$SMOKE_MODEL" \
            --cache-dir "$RUNNER_TEMP/shotsieve-cache/$SMOKE_MODEL" \
            --data-dir "$RUNNER_TEMP/shotsieve-data/$SMOKE_MODEL" \
            --offline \
            --report-path "$RUNNER_TEMP/shotsieve-model-smoke/$SMOKE_MODEL-offline.json"

      - name: Upload sanitized model smoke reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: model-smoke-${{ matrix.model }}-reports
          path: ${{ runner.temp }}/shotsieve-model-smoke/*.json
          if-no-files-found: ignore
          retention-days: 14
