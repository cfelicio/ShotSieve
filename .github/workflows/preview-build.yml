name: preview-build

on:
  push:
    branches:
      - 0.5.x
  workflow_dispatch:

concurrency:
  group: preview-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  RELEASE_CONSTRAINTS: scripts/release-constraints.txt

jobs:
  test:
    name: test-${{ matrix.os }}-py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    if: github.ref == 'refs/heads/0.5.x'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel packaging
          python -m pip install -e .[test]

      - name: Check installed requirements
        run: python -m pip check

      - name: Run focused static checks
        run: python -m ruff check --select F,E9 src tests

      - name: Install browser for frontend tests
        run: python -m playwright install --with-deps chromium

      - name: Run test suite
        run: python -m pytest -q

  prepare-preview-matrix:
    name: prepare-preview-matrix
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/0.5.x'

    outputs:
      runtime_matrix: ${{ steps.runtime-matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - id: runtime-matrix
        name: Export runtime pack build matrix
        shell: bash
        run: |
          echo 'matrix<<EOF' >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys
          from pathlib import Path

          project_root = Path.cwd()
          sys.path.insert(0, str(project_root / "src"))
          from shotsieve.release_targets import tier1_release_matrix

          print(json.dumps({"include": tier1_release_matrix()}))
          PY
          echo 'EOF' >> "$GITHUB_OUTPUT"

  build-tier1-portable-bundles:
    name: build-${{ matrix.id }}
    runs-on: ${{ matrix.runsOn }}
    if: github.ref == 'refs/heads/0.5.x'
    needs:
      - test
      - prepare-preview-matrix
    env:
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-preview-matrix.outputs.runtime_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.pythonVersion }}

      - name: Free disk space on Linux runners
        if: runner.os == 'Linux'
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo docker image prune --all --force || true
          df -h

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel packaging -c ${{ env.RELEASE_CONSTRAINTS }} -c ${{ matrix.constraintsFile }}

      - name: Build local ROCm 10 selector wheel
        if: matrix.torchVariant == 'rocm10-gfx1103'
        run: python -m pip wheel --no-deps --wheel-dir "build/release-targets/${{ matrix.id }}/rocm-selector-wheel" rocm==10.0.0 --index-url https://stable.repo.amd.com/rocm/whl-next/ --extra-index-url https://pypi.org/simple

      - name: Install pinned AMD ROCm 10 gfx1103 Torch runtime
        if: matrix.torchVariant == 'rocm10-gfx1103'
        run: python -m pip install --no-cache-dir rocm==10.0.0 "torch[device-gfx1103]==2.13.0+rocm10.0.0" "torchvision[device-gfx1103]==0.28.0+rocm10.0.0" --index-url https://stable.repo.amd.com/rocm/whl-next/ --extra-index-url https://pypi.org/simple --find-links "build/release-targets/${{ matrix.id }}/rocm-selector-wheel" --only-binary=rocm -c ${{ env.RELEASE_CONSTRAINTS }} -c ${{ matrix.constraintsFile }}

      - name: Install CPU Torch runtime
        if: matrix.torchVariant == 'cpu'
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu -c ${{ env.RELEASE_CONSTRAINTS }} -c ${{ matrix.constraintsFile }}

      - name: Install default Torch runtime
        if: matrix.torchVariant == 'default'
        run: |
          python -m pip install torch torchvision -c ${{ env.RELEASE_CONSTRAINTS }} -c ${{ matrix.constraintsFile }}

      - name: Install pinned CUDA Torch runtime
        if: matrix.torchVariant == 'cuda'
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cu130 --trusted-host download.pytorch.org -c ${{ env.RELEASE_CONSTRAINTS }} -c ${{ matrix.constraintsFile }}

      - name: Install pinned Intel XPU Torch runtime
        if: matrix.torchVariant == 'xpu'
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/xpu --extra-index-url https://pypi.org/simple -c ${{ env.RELEASE_CONSTRAINTS }} -c ${{ matrix.constraintsFile }}

      - name: Install pinned AMD ROCm Linux Torch runtime
        if: matrix.torchVariant == 'rocm' && matrix.platform == 'linux'
        shell: bash
        run: |
          python -m pip install --no-cache-dir \
            "https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2.1/torch-2.9.1%2Brocm7.2.1.lw.gitff65f5bc-cp312-cp312-linux_x86_64.whl" \
            "https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2.1/torchvision-0.24.0%2Brocm7.2.1.gitb919bd0c-cp312-cp312-linux_x86_64.whl" \
            "https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2.1/torchaudio-2.9.0%2Brocm7.2.1.gite3c6ee2b-cp312-cp312-linux_x86_64.whl" \
            "https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2.1/triton-3.5.1%2Brocm7.2.1.gita272dfa8-cp312-cp312-linux_x86_64.whl" \
            -c ${{ env.RELEASE_CONSTRAINTS }} -c ${{ matrix.constraintsFile }}

      - name: Install pinned AMD ROCm Windows Torch runtime
        if: matrix.torchVariant == 'rocm' && matrix.platform == 'windows'
        shell: pwsh
        run: |
          python -m pip install --no-cache-dir `
            "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/rocm_sdk_core-7.2.1-py3-none-win_amd64.whl" `
            "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/rocm_sdk_devel-7.2.1-py3-none-win_amd64.whl" `
            "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/rocm_sdk_libraries_custom-7.2.1-py3-none-win_amd64.whl" `
            "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/rocm-7.2.1.tar.gz" `
            "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/torch-2.9.1%2Brocm7.2.1-cp312-cp312-win_amd64.whl" `
            "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/torchaudio-2.9.1%2Brocm7.2.1-cp312-cp312-win_amd64.whl" `
            "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/torchvision-0.24.1%2Brocm7.2.1-cp312-cp312-win_amd64.whl" `
            --trusted-host repo.radeon.com `
            -c ${{ env.RELEASE_CONSTRAINTS }} -c ${{ matrix.constraintsFile }}

      - name: Install ShotSieve build dependencies
        run: |
          python -m pip install -e ".[${{ join(matrix.extras, ',') }}]" -c ${{ env.RELEASE_CONSTRAINTS }} -c ${{ matrix.constraintsFile }}
          python -m pip install pyinstaller -c ${{ env.RELEASE_CONSTRAINTS }} -c ${{ matrix.constraintsFile }}

      - name: Check resolved build requirements
        run: python -m pip check

      - name: Build portable bundle
        env:
          SHOTSIEVE_SKIP_BUNDLED_TORCH: "1"
        run: python scripts/build_portable_bundle.py --target ${{ matrix.id }}

      - name: Export portable bundle plan
        shell: pwsh
        run: |
          python scripts/build_portable_bundle.py --target ${{ matrix.id }} --plan | Set-Content -Path bundle-plan.json

      - name: Smoke test portable bundle
        shell: pwsh
        run: |
          $plan = Get-Content bundle-plan.json -Raw | ConvertFrom-Json
          if (-not (Test-Path $plan.archivePath)) {
            throw "Expected archive not found at $($plan.archivePath)"
          }

          $launcher = Join-Path $plan.distPath $plan.target.executableName
          if (-not (Test-Path $launcher)) {
            throw "Expected launcher not found at $launcher"
          }

          $bundledWeights = Get-ChildItem -LiteralPath $plan.distPath -Recurse -File |
            Where-Object { $_.Extension.ToLowerInvariant() -in @('.safetensors', '.ckpt', '.pth', '.pt') }
          if ($bundledWeights) {
            $paths = ($bundledWeights | ForEach-Object { $_.FullName }) -join ", "
            throw "Model weight files must not be bundled in a portable release: $paths"
          }

          $bundledTorch = Get-ChildItem -LiteralPath $plan.distPath -Recurse -File |
            Where-Object { $_.FullName -match '(?i)(\\|/)(torch|torchvision|torchaudio|functorch|triton)(\\|/)' -or $_.Name -match '(?i)^(torch|torchvision|torchaudio|functorch|triton)' }
          if ($bundledTorch) {
            $paths = ($bundledTorch | ForEach-Object { $_.FullName }) -join ", "
            throw "PyTorch packages and native libraries must not be bundled in a portable release: $paths"
          }

          & $launcher --help | Out-Null

      - name: Upload preview bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.id }}-preview-build
          path: dist/${{ matrix.archiveName }}
          if-no-files-found: error
          retention-days: 7
